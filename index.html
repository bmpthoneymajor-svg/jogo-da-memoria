
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>🧠 Jogo da Memória</h1>
        <p>Encontre todos os pares de cartas!</p>

        <div class="informacoes">
            <span>Movimentos: <strong id="movimentos">0</strong></span>
            <span>Pares: <strong id="pares">0</strong>/8</span>
        </div>

        <div class="tabuleiro" id="tabuleiro"></div>

        <button id="reiniciar">Reiniciar jogo</button>

        <p id="mensagem" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
